<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Safari Keyboard Shortcuts – Practice</title>
  <style>
    :root {
      --bg: #f5f5f7;
      --card: #ffffff;
      --text: #1d1d1f;
      --muted: #6e6e73;
      --accent: #0071e3;
      --border: #d2d2d7;
      --danger: #ff3b30;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000000;
        --card: #1c1c1e;
        --text: #f5f5f7;
        --muted: #98989d;
        --accent: #0a84ff;
        --border: #38383a;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
      padding: 24px 16px 60px;
      max-width: 820px;
      margin: 0 auto;
    }
    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .subtitle {
      color: var(--muted);
      font-size: 0.95rem;
      margin-bottom: 20px;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 24px;
      align-items: center;
    }
    button {
      font: inherit;
      font-size: 0.9rem;
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    button:hover { background: var(--border); }
    button.primary {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }
    button.primary:hover { filter: brightness(1.1); }
    button.danger {
      color: var(--danger);
      border-color: var(--danger);
    }
    .stats {
      font-size: 0.9rem;
      color: var(--muted);
      margin-left: auto;
    }
    .category {
      margin-bottom: 28px;
    }
    .category h2 {
      font-size: 1.15rem;
      font-weight: 600;
      margin-bottom: 10px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
    }
    .shortcut {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      background: var(--card);
      border-radius: 10px;
      margin-bottom: 6px;
      border: 1px solid transparent;
    }
    .shortcut:hover {
      border-color: var(--border);
    }
    .keys {
      font-family: "SF Mono", ui-monospace, Menlo, monospace;
      font-size: 0.92rem;
      font-weight: 500;
      background: var(--bg);
      padding: 4px 10px;
      border-radius: 6px;
      min-width: 150px;
      text-align: center;
      white-space: nowrap;
      border: 1px solid var(--border);
    }
    .action {
      flex: 1;
      font-size: 0.95rem;
    }
    .hide-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 0.85rem;
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
    }
    .hide-btn:hover {
      background: var(--border);
      color: var(--text);
    }
    .empty-msg {
      text-align: center;
      color: var(--muted);
      padding: 40px 20px;
      display: none;
    }
    footer {
      margin-top: 40px;
      font-size: 0.8rem;
      color: var(--muted);
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>Safari Keyboard Shortcuts</h1>
  <p class="subtitle">Hide the ones you already know. Your choices are saved in this browser.</p>

  <div class="controls">
    <button class="primary" id="showAllBtn">Show all hidden</button>
    <button class="danger" id="resetBtn">Reset everything</button>
    <span class="stats" id="stats"></span>
  </div>

  <div id="list"></div>
  <div class="empty-msg" id="emptyMsg">All shortcuts are currently hidden. Click “Show all hidden” to bring them back.</div>

  <footer>
    Open this file in Safari or any browser. Data stays on your Mac (localStorage).
  </footer>

  <script>
    const shortcuts = [
      // Tabs & Windows
      { id: "tab-new", keys: "⌘ T", action: "New tab", cat: "Tabs & Windows" },
      { id: "tab-close", keys: "⌘ W", action: "Close current tab", cat: "Tabs & Windows" },
      { id: "tab-reopen", keys: "⇧ ⌘ T", action: "Reopen last closed tab", cat: "Tabs & Windows" },
      { id: "tab-next", keys: "⌃ Tab  or  ⇧ ⌘ ]", action: "Next tab", cat: "Tabs & Windows" },
      { id: "tab-prev", keys: "⌃ ⇧ Tab  or  ⇧ ⌘ [", action: "Previous tab", cat: "Tabs & Windows" },
      { id: "tab-1to8", keys: "⌘ 1 – ⌘ 8", action: "Switch to tab 1–8", cat: "Tabs & Windows" },
      { id: "tab-last", keys: "⌘ 9", action: "Switch to last tab", cat: "Tabs & Windows" },
      { id: "tab-overview", keys: "⇧ ⌘ \\", action: "Show Tab Overview", cat: "Tabs & Windows" },
      { id: "win-new", keys: "⌘ N", action: "New window", cat: "Tabs & Windows" },
      { id: "win-private", keys: "⇧ ⌘ N", action: "New Private window", cat: "Tabs & Windows" },
      { id: "win-close", keys: "⇧ ⌘ W", action: "Close window", cat: "Tabs & Windows" },
      { id: "win-cycle", keys: "⌘ `", action: "Cycle through Safari windows", cat: "Tabs & Windows" },

      // Navigation
      { id: "nav-back", keys: "⌘ [  or  ⌘ ←", action: "Go back", cat: "Navigation" },
      { id: "nav-forward", keys: "⌘ ]  or  ⌘ →", action: "Go forward", cat: "Navigation" },
      { id: "nav-reload", keys: "⌘ R", action: "Reload page", cat: "Navigation" },
      { id: "nav-reload-hard", keys: "⌥ ⌘ R", action: "Reload without cache", cat: "Navigation" },
      { id: "nav-stop", keys: "⌘ .  or  Esc", action: "Stop loading", cat: "Navigation" },
      { id: "nav-home", keys: "⇧ ⌘ H", action: "Go to homepage", cat: "Navigation" },
      { id: "nav-address", keys: "⌘ L", action: "Focus Smart Search / address bar", cat: "Navigation" },
      { id: "nav-open-newtab", keys: "⌘ Return", action: "Open address-bar URL in new tab", cat: "Navigation" },

      // Page content & search
      { id: "page-find", keys: "⌘ F", action: "Find on page", cat: "Page & Search" },
      { id: "page-find-next", keys: "⌘ G", action: "Find next match", cat: "Page & Search" },
      { id: "page-find-prev", keys: "⇧ ⌘ G", action: "Find previous match", cat: "Page & Search" },
      { id: "page-zoom-in", keys: "⌘ +", action: "Zoom in", cat: "Page & Search" },
      { id: "page-zoom-out", keys: "⌘ −", action: "Zoom out", cat: "Page & Search" },
      { id: "page-zoom-reset", keys: "⌘ 0", action: "Actual size (reset zoom)", cat: "Page & Search" },
      { id: "page-top", keys: "⌘ ↑", action: "Scroll to top of page", cat: "Page & Search" },
      { id: "page-bottom", keys: "⌘ ↓", action: "Scroll to bottom of page", cat: "Page & Search" },
      { id: "page-scroll-down", keys: "Space", action: "Scroll down one screen", cat: "Page & Search" },
      { id: "page-scroll-up", keys: "⇧ Space", action: "Scroll up one screen", cat: "Page & Search" },
      { id: "page-reader", keys: "⇧ ⌘ R", action: "Toggle Reader mode", cat: "Page & Search" },
      { id: "page-print", keys: "⌘ P", action: "Print", cat: "Page & Search" },

      // Bookmarks & Reading List
      { id: "bm-add", keys: "⌘ D", action: "Add bookmark", cat: "Bookmarks & Reading List" },
      { id: "bm-sidebar", keys: "⌃ ⌘ 1", action: "Show/hide Bookmarks sidebar", cat: "Bookmarks & Reading List" },
      { id: "rl-add", keys: "⇧ ⌘ D", action: "Add page to Reading List", cat: "Bookmarks & Reading List" },
      { id: "rl-sidebar", keys: "⌃ ⌘ 2", action: "Show/hide Reading List sidebar", cat: "Bookmarks & Reading List" },
      { id: "fav-bar", keys: "⇧ ⌘ B", action: "Show/hide Favorites bar", cat: "Bookmarks & Reading List" },

      // Other useful
      { id: "other-downloads", keys: "⌥ ⌘ L", action: "Show Downloads", cat: "Other" },
      { id: "other-history", keys: "⌘ Y", action: "Show History", cat: "Other" },
      { id: "other-settings", keys: "⌘ ,", action: "Safari Settings", cat: "Other" },
      { id: "other-copy-url", keys: "⌥ ⌘ C", action: "Copy page URL", cat: "Other" },
      { id: "other-webinspector", keys: "⌥ ⌘ I", action: "Show Web Inspector (Develop menu)", cat: "Other" },
    ];

    const STORAGE_KEY = "safariShortcutsHidden_v1";

    function loadHidden() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : [];
      } catch {
        return [];
      }
    }

    function saveHidden(ids) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(ids));
    }

    let hiddenIds = loadHidden();

    function render() {
      const container = document.getElementById("list");
      const emptyMsg = document.getElementById("emptyMsg");
      container.innerHTML = "";

      const categories = [...new Set(shortcuts.map(s => s.cat))];
      let visibleCount = 0;

      categories.forEach(cat => {
        const items = shortcuts.filter(s => s.cat === cat);
        const visibleItems = items.filter(s => !hiddenIds.includes(s.id));
        if (visibleItems.length === 0) return;

        const section = document.createElement("div");
        section.className = "category";
        section.innerHTML = `<h2>${cat}</h2>`;

        visibleItems.forEach(s => {
          visibleCount++;
          const row = document.createElement("div");
          row.className = "shortcut";
          row.dataset.id = s.id;
          row.innerHTML = `
            <span class="keys">${s.keys}</span>
            <span class="action">${s.action}</span>
            <button class="hide-btn" title="Hide this shortcut">Hide</button>
          `;
          row.querySelector(".hide-btn").addEventListener("click", () => {
            hiddenIds.push(s.id);
            saveHidden(hiddenIds);
            render();
          });
          section.appendChild(row);
        });

        container.appendChild(section);
      });

      emptyMsg.style.display = visibleCount === 0 ? "block" : "none";
      document.getElementById("stats").textContent =
        `${visibleCount} visible · ${hiddenIds.length} hidden`;
    }

    document.getElementById("showAllBtn").addEventListener("click", () => {
      hiddenIds = [];
      saveHidden(hiddenIds);
      render();
    });

    document.getElementById("resetBtn").addEventListener("click", () => {
      if (confirm("Reset and show every shortcut again?")) {
        hiddenIds = [];
        saveHidden(hiddenIds);
        render();
      }
    });

    render();
  </script>
</body>
</html>
