<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Values — Study Tool</title>
<style>
  :root{--accent:#d94f3d;--bg:#f2f2f4;--card:#fff;--ink:#17171a;--mut:#8a8a93}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
  [hidden]{display:none!important}
  body{margin:0;font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       background:var(--bg);color:var(--ink);display:flex;flex-direction:column;height:100dvh;overflow:hidden}
  header{display:flex;align-items:center;justify-content:space-between;background:var(--card);
         padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));box-shadow:0 1px 0 #e3e3e8}
  .logo{font-weight:800;font-style:italic;color:var(--accent);font-size:20px}
  .btn{border:0;border-radius:12px;padding:10px 16px;font-weight:600;font-size:15px;background:#e8e8ec;color:var(--ink)}
  .btn.primary{background:var(--accent);color:#fff}
  .btn.big{padding:16px;font-size:17px;width:100%;display:block;text-align:center}
  .btn.ghost{background:none;color:var(--mut);padding:8px}
  main{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:10px}
  #view{max-width:100%;max-height:100%;border-radius:8px;box-shadow:0 2px 12px #0002}
  #start{text-align:center;max-width:320px;margin:auto;display:flex;flex-direction:column;gap:12px;padding:0 8px}
  #start h1{margin:0 0 4px;font-size:26px}
  #start p{margin:0 0 12px;color:var(--mut)}
  #start small{color:var(--mut)}
  #controls{background:var(--card);border-radius:20px 20px 0 0;box-shadow:0 -4px 20px #0001;
            padding:16px;max-height:47%;overflow-y:auto;
            padding-bottom:calc(16px + env(safe-area-inset-bottom))}
  .row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .stepper{display:flex;align-items:center;gap:12px;font-weight:700}
  .stepper button{width:38px;height:38px;border-radius:50%;border:0;background:#e8e8ec;font-size:20px;font-weight:700}
  #hist{width:100%;height:70px;display:block;margin:4px 0 10px}
  .stop,.sl{display:grid;grid-template-columns:70px 1fr 48px;align-items:center;gap:8px;margin:8px 0;font-size:13px;color:var(--mut)}
  .stop output,.sl output{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink)}
  input[type=range]{accent-color:var(--accent);width:100%;height:28px}
  #dist{display:flex;justify-content:space-around;margin-top:12px}
  .ditem{display:flex;flex-direction:column;align-items:center;gap:4px}
  .ditem .sw{width:56px;border-radius:6px;border:1px solid #0002}
  .ditem b{font-size:12px}.ditem i{font-style:normal;color:var(--mut);font-size:11px}
  h3{margin:14px 0 6px;font-size:12px;letter-spacing:.06em;color:var(--mut);text-transform:uppercase}
</style>
</head>
<body>
<header>
  <div class="logo">Values</div>
  <button id="exportBtn" class="btn primary" hidden>Export</button>
</header>

<main>
  <section id="start">
    <h1>Value Study</h1>
    <p>Turn any photo into a simple notan / value study.</p>
    <label class="btn primary big">📷 Take a selfie<input type="file" id="camera" accept="image/*" capture="user" hidden></label>
    <label class="btn big">🖼️ Upload a picture<input type="file" id="upload" accept="image/*" hidden></label>
    <small>100% on‑device — nothing is uploaded.</small>
  </section>
  <canvas id="view" hidden></canvas>
</main>

<section id="controls" hidden>
  <div class="row">
    <div class="stepper"><button id="minus">−</button><span><span id="valCount">3</span> values</span><button id="plus">+</button></div>
    <button id="newPhoto" class="btn ghost">New photo</button>
  </div>

  <h3>Histogram & stops</h3>
  <canvas id="hist"></canvas>
  <div id="stops"></div>

  <h3>Adjust</h3>
  <label class="sl"><span>Simplicity</span><input type="range" id="simp" min="0" max="10" value="0"><output id="simpOut">0</output></label>
  <label class="sl"><span>Mid key</span><input type="range" id="mid" min="-100" max="100" value="0"><output id="midOut">0</output></label>

  <h3>Value distribution</h3>
  <div id="dist"></div>
</section>

<script>
const $=s=>document.querySelector(s);
const view=$('#view'),ctx=view.getContext('2d'),hist=$('#hist'),hctx=hist.getContext('2d');
let W=0,H=0,lum=null,blurLum=null,nValues=3,stops=[33,67],simp=0,mid=0,raf=0;

$('#camera').addEventListener('change',e=>{loadFile(e.target.files[0]);e.target.value='';});
$('#upload').addEventListener('change',e=>{loadFile(e.target.files[0]);e.target.value='';});
$('#minus').onclick=()=>setN(nValues-1);
$('#plus').onclick=()=>setN(nValues+1);
$('#simp').addEventListener('input',e=>{simp=+e.target.value;$('#simpOut').textContent=simp;schedule();});
$('#mid').addEventListener('input',e=>{mid=+e.target.value;$('#midOut').textContent=(mid>0?'+':'')+mid;schedule();});
$('#newPhoto').onclick=()=>{lum=null;view.hidden=true;$('#controls').hidden=true;$('#exportBtn').hidden=true;$('#start').hidden=false;};
$('#exportBtn').addEventListener('click',()=>{
  view.toBlob(async blob=>{
    const file=new File([blob],'value-study.png',{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:'Value study'});}catch(e){}}
    else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='value-study.png';a.click();}
  },'image/png');
});

function loadFile(f){if(!f)return;const url=URL.createObjectURL(f);const img=new Image();
  img.onload=()=>{setup(img);URL.revokeObjectURL(url);};img.src=url;}

function setup(img){
  const MAX=1400,sc=Math.min(1,MAX/Math.max(img.width,img.height));
  W=Math.round(img.width*sc);H=Math.round(img.height*sc);
  view.width=W;view.height=H;ctx.drawImage(img,0,0,W,H);
  const d=ctx.getImageData(0,0,W,H).data;lum=new Float32Array(W*H);
  for(let i=0,p=0;i<lum.length;i++,p+=4)lum[i]=.2126*d[p]+.7152*d[p+1]+.0722*d[p+2];
  $('#start').hidden=true;view.hidden=false;$('#controls').hidden=false;$('#exportBtn').hidden=false;
  buildStops();process();
}
function setN(n){n=Math.min(6,Math.max(2,n));if(n===nValues)return;nValues=n;$('#valCount').textContent=n;
  stops=Array.from({length:n-1},(_,i)=>Math.round((i+1)*100/n));buildStops();schedule();}
function buildStops(){
  const c=$('#stops');c.innerHTML='';
  stops.forEach((v,i)=>{
    const row=document.createElement('label');row.className='stop';
    row.innerHTML=`<span>Stop ${i+1}</span><input type="range" min="2" max="98" value="${v}"><output>${v}%</output>`;
    const r=row.querySelector('input'),o=row.querySelector('output');
    r.addEventListener('input',()=>{let val=+r.value;
      const lo=i>0?stops[i-1]+2:2,hi=i<stops.length-1?stops[i+1]-2:98;
      val=Math.min(hi,Math.max(lo,val));r.value=val;stops[i]=val;o.textContent=val+'%';schedule();});
    c.appendChild(row);
  });
}
function schedule(){cancelAnimationFrame(raf);raf=requestAnimationFrame(process);}
const cl=(v,m)=>v<0?0:v>=m?m-1:v, clamp=(v,a,b)=>v<a?a:v>b?b:v;

function boxH(s,d,w,h,r){const win=2*r+1;for(let y=0;y<h;y++){const row=y*w;let sum=0;
  for(let x=-r;x<=r;x++)sum+=s[row+cl(x,w)];
  for(let x=0;x<w;x++){d[row+x]=sum/win;sum+=s[row+cl(x+r+1,w)]-s[row+cl(x-r,w)];}}}
function boxV(s,d,w,h,r){const win=2*r+1;for(let x=0;x<w;x++){let sum=0;
  for(let y=-r;y<=r;y++)sum+=s[cl(y,h)*w+x];
  for(let y=0;y<h;y++){d[y*w+x]=sum/win;sum+=s[cl(y+r+1,h)*w+x]-s[cl(y-r,h)*w+x];}}}
function blur(src,w,h,r){const tmp=new Float32Array(src.length),out=new Float32Array(src.length);
  for(let p=0;p<2;p++){boxH(p?out:src,tmp,w,h,r);boxV(tmp,out,w,h,r);}return out;}

function process(){
  if(!lum)return;
  blurLum=simp>0?blur(lum,W,H,simp):lum;
  const th=stops.map(s=>clamp(s/100*255+mid*.8,0,255));
  const levels=Array.from({length:nValues},(_,i)=>Math.round(i*255/(nValues-1)));
  const img=ctx.createImageData(W,H),d=img.data,counts=new Array(nValues).fill(0);
  for(let i=0,p=0;i<blurLum.length;i++,p+=4){
    let k=0;while(k<th.length&&blurLum[i]>=th[k])k++;
    const g=levels[k];counts[k]++;d[p]=d[p+1]=d[p+2]=g;d[p+3]=255;
  }
  ctx.putImageData(img,0,0);drawHist();drawDist(counts,levels);
}
function drawHist(){
  const dpr=devicePixelRatio||1,w=hist.clientWidth,h=hist.clientHeight;
  hist.width=w*dpr;hist.height=h*dpr;hctx.setTransform(dpr,0,0,dpr,0,0);hctx.clearRect(0,0,w,h);
  const bins=64,c=new Array(bins).fill(0);
  for(let i=0;i<blurLum.length;i+=4)c[Math.min(bins-1,blurLum[i]>>2)]++;
  const max=Math.max(...c);hctx.beginPath();hctx.moveTo(0,h);
  for(let i=0;i<bins;i++)hctx.lineTo(i/(bins-1)*w,h-4-(c[i]/max)*(h-10));
  hctx.lineTo(w,h);hctx.closePath();hctx.fillStyle='#d9d9de';hctx.fill();
  hctx.strokeStyle='#d94f3d';hctx.lineWidth=2;
  stops.forEach(s=>{const x=s/100*w;hctx.beginPath();hctx.moveTo(x,2);hctx.lineTo(x,h-2);hctx.stroke();});
}
function drawDist(counts,levels){
  const total=counts.reduce((a,b)=>a+b,0),el=$('#dist');el.innerHTML='';
  counts.forEach((c,i)=>{const pct=Math.round(c/total*100),g=levels[i];
    const it=document.createElement('div');it.className='ditem';
    it.innerHTML=`<b>${pct}%</b><span class="sw" style="background:rgb(${g},${g},${g});height:${Math.max(6,pct*.5)}px"></span><i>${i+1}</i>`;
    el.appendChild(it);});
}
</script>
</body>
</html>
